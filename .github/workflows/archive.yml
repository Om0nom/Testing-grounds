name: Archive NAS Status

on:
  schedule:
    - cron: "33, 63, 123, 153,183,213 * * * *"   # toutes les 30 min (UTC)
  workflow_dispatch:          # permet un lancement manuel

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'état NAS
        run: |
          JOUR=$(date -u +%Y-%m-%d)
          HEURE=$(date -u +%H%M%S)
          mkdir -p "archive/$JOUR"
          curl -sf --retry 3 "https://nasstatus.faa.gov/api/airport-status-information" \
            -o "archive/$JOUR/nas_${JOUR}_${HEURE}.xml"

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add archive
          git commit -m "Archive $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
